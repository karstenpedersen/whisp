[project]
name = "whisp"
version = "0.1.0"
description = "Program for listening for commands"
readme = "README.md"
authors = [
    { name = "Karsten Pedersen", email = "karstenfp.all@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "typer>=0.29.2",
]

[project.scripts]
whisp = "whisp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
